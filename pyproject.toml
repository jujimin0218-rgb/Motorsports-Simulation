[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-race-engine"
version = "0.4.0"
description = "Physics-based F1 race simulation engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
# `testpaths` below runs the game's suite as well as the engine's, and that
# suite imports the web layer -- so the install the README tells a contributor
# to make has to carry it, or `pytest` fails at collection rather than at a
# test.  httpx is what starlette's TestClient is built on; it ships separately.
dev = ["f1-race-engine[server]", "httpx2>=2.0", "pytest>=7.4", "matplotlib>=3.7"]
# The engine itself has no dependencies -- it is a physics library, and
# `dependencies = []` above means that literally.  The season-management game
# in backend/ is a separate layer built on top of it, and *that* is what needs
# a web framework.  Kept out of the base install so the engine stays usable on
# its own; `pip install -e ".[server]"` is what play.py and BETA.md ask for.
server = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]

[tool.setuptools.packages.find]
include = ["f1_race_engine*"]

[tool.setuptools.package-data]
"f1_race_engine.data" = ["tracks/*.json", "vehicles/*.json", "tyres/*.json", "drivers/*.json"]

[tool.pytest.ini_options]
# The race engine's tests and the game's, run together: the game is built on
# the engine, so a change that breaks the engine has to fail the game's suite
# too rather than being found later.
testpaths = ["tests", "backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
